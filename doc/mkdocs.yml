site_name: YScore 文档
site_description: YScore SoC 学习文档 - 硬件设计 / 软件栈 / Debug 排错
site_author: YScore
repo_url: https://github.com/Simon-vr/YScore
repo_name: Simon-vr/YScore
docs_dir: learn
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Simon-vr/YScore

hooks:
  - hooks/copy_assets.py

nav:
  - 首页: README.md
  - 项目总览: 00-project-overview.md
  - 硬件基础:
      - 章节导航: 01-hardware-basics/README.md
      - 00 设计流程: 01-hardware-basics/00-design-flow.md
      - 01 R 指令: 01-hardware-basics/01-r-instructions.md
      - 02 I 指令: 01-hardware-basics/02-i-instructions.md
      - 03 Load/Store 指令: 01-hardware-basics/03-ls-instructions.md
      - 04 分支指令: 01-hardware-basics/04-branch-instructions.md
      - 05 其他指令: 01-hardware-basics/05-other-instructions.md
      - 06 C 语言测试: 01-hardware-basics/06-c-language-test.md
      - 07 CSR 实现: 01-hardware-basics/07-csr-implementation.md
      - 08 异常处理: 01-hardware-basics/08-exception-handling.md
      - 09 AXI 外设: 01-hardware-basics/09-axi-peripherals.md
      - 10 UART/GPIO 适配: 01-hardware-basics/10-uart-gpio-adaptation.md
      - 11 FPGA 部署: 01-hardware-basics/11-fpga-deployment.md
      - 12 仿真测试平台: 01-hardware-basics/12-tb-simulation-guide.md
  - 软件栈:
      - 章节导航: 02-software-stack/README.md
      - 01 QEMU 环境: 02-software-stack/01-qemu-environment.md
      - 02 运行时环境: 02-software-stack/02-runtime-environment.md
      - 03 多任务: 02-software-stack/03-multitasking.md
      - 04 Shell 实现: 02-software-stack/04-shell-implementation.md
      - 05 Game 实现: 02-software-stack/05-game-implementation.md
      - 06 移植指南: 02-software-stack/06-porting-guide.md
      - 07 移植后 Debug: 02-software-stack/07-post-port-debug.md
  - Debug 踩坑:
      - 章节导航: 03-debug-pitfalls/README.md
      - 01 硬件坑: 03-debug-pitfalls/01-hardware-pitfalls.md
      - 02 软件坑: 03-debug-pitfalls/02-software-pitfalls.md
      - 03 硬软联调实录: 03-debug-pitfalls/03-hw-sw-co-debug.md
